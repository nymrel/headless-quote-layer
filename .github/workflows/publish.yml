# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Publish verified npm package

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged main-branch candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main
          echo "commit_sha=${tag_commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install exact npm outside the project contract
        # zizmor: ignore[adhoc-packages]
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Run source, package, and dependency gates
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run audit:ci
          npm run audit:prod

  build:
    name: Build immutable npm archive
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install exact npm outside the project contract
        # zizmor: ignore[adhoc-packages]
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Build archive and checksum
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:package
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          sha256sum release/*.tgz > release/SHA256SUMS

      - name: Upload immutable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-package-${{ needs.verify.outputs.commit_sha }}
          path: release
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest package build
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      attestations: write  # Create the GitHub artifact attestation for the exact npm archive.
      contents: read
      id-token: write  # Exchange the workflow identity for the attestation signing token.
    steps:
      - name: Download immutable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-package-${{ needs.verify.outputs.commit_sha }}
          path: release

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/**/*

  publish:
    name: Publish through npm trusted publishing
    needs: [verify, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: npm
      url: https://www.npmjs.com/package/@nymrel/headless-quote
    permissions:
      contents: read
      id-token: write  # Exchange the npm environment identity for a short-lived publish token.
    steps:
      - name: Download immutable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-package-${{ needs.verify.outputs.commit_sha }}
          path: release

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install trusted-publishing npm client
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Publish the exact archive with provenance
        run: |
          mapfile -t packages < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts
